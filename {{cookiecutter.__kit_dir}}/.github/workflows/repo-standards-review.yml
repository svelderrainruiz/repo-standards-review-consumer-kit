# Managed by the repo-standards-review consumer kit (templates/consumer); update it with `cruft update`.
name: repo-standards-review consumer check

on:
  pull_request:
  push:
    branches:
{%- for branch in cookiecutter.default_branches.split(",") if branch.strip() %}
      - "{{ branch.strip() }}"
{%- endfor %}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-check:
{%- set labels = cookiecutter.github_runs_on.split(",") | map("trim") | select | list %}
    runs-on: {% if labels | length == 1 %}{{ labels[0] }}{% else %}[{{ labels | join(", ") }}]{% endif %}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the consumer pin and script line endings
        run: python3 .repo-standards-review/check_consumer.py
